<title>Superior Stone</title>
<style>
:root{--bg:#1a1a17;--surface:#232320;--card:#2a2a26;--border:#38382f;--orange:#d4642a;--text:#f0ede8;--muted:#8a8880;--dim:#5a5955;--red:#c0392b;--yellow:#c8960a;--green:#2d7a45;--redBg:#2c1a18;--yellowBg:#2c2410;--greenBg:#182c20}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;width:100%}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
.btn-primary{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-danger{background:var(--redBg);border:1px solid var(--red);color:var(--red)}
.btn-green{background:var(--greenBg);border:1px solid var(--green);color:var(--green)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:monospace}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top:2px solid var(--orange);border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-weight:700;font-size:18px;margin-bottom:18px}
.section{margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border)}
#header{padding:20px 24px 0}
#header .title{font-weight:800;font-size:22px;letter-spacing:-.01em}
#tabs{display:flex;border-bottom:1px solid var(--border);flex-wrap:wrap;margin-top:12px;overflow-x:auto}
.tab-btn{background:none;border:none;color:var(--muted);font-weight:500;font-size:14px;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab-btn.active{color:var(--text);font-weight:700;border-bottom-color:var(--orange)}
.fab{position:fixed;bottom:28px;right:24px;width:56px;height:56px;background:var(--orange);border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(212,100,42,.5);display:flex;align-items:center;justify-content:center;z-index:100}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--orange);border-radius:10px;padding:12px 22px;font-weight:600;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:999;display:none;white-space:nowrap}
.pill{border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:transparent;color:var(--muted)}
.pill.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.prog-bar{height:4px;background:var(--border);border-radius:999px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:999px}
#loading{position:fixed;inset:0;background:#1a1a17;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999}
#loading .logo{font-size:48px}
#loading .msg{color:#8a8880;font-size:14px}
#error-screen{display:none;position:fixed;inset:0;background:#1a1a17;padding:32px;z-index:9999}
@media print{#header,#tabs,.fab,#toast,.no-print{display:none!important}body{background:#fff;color:#000}}
</style>
</head>

<script>
// Global error handler -- shows error screen instead of blank page
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-title').textContent = 'JavaScript Error (line ' + line + ')';
  document.getElementById('error-msg').textContent = (err ? err.stack : msg) || msg;
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-title').textContent = 'Promise Error';
  document.getElementById('error-msg').textContent = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown error';
});
</script>

const {useState:uS,useEffect:uE,useRef:uR,useCallback:uC,createContext,useContext} = React;
const AuthCtx = createContext(null);
const useAuth = () => useContext(AuthCtx);

function AuthProvider({children}){
  const [session,setSession]=uS(undefined);
  const [profile,setProfile]=uS(null);

  async function loadProfile(uid){
    const {data}=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
    setProfile(data||null);
  }

  uE(()=>{
    sb.auth.getSession().then(({data})=>{
      setSession(data.session);
      if(data.session) loadProfile(data.session.user.id);
      else setSession(null);
    });
    const {data:sub}=sb.auth.onAuthStateChange((_,s)=>{
      setSession(s);
      if(s) loadProfile(s.user.id);
      else{setSession(null);setProfile(null);}
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  return React.createElement(AuthCtx.Provider,{value:{session,profile,setProfile,reload:()=>session&&loadProfile(session.user.id)}},children);
}

function MaterialsTab({profile,showToast}){
  const C=DARK;
  const [materials,setMaterials]=uS([]);const [cats,setCats]=uS([]);const [locStock,setLocStock]=uS([]);
  const [search,setSearch]=uS("");const [catFilt,setCatFilt]=uS("All");const [locFilt,setLocFilt]=uS("All");
  const [editing,setEditing]=uS(null);const [transferring,setTransferring]=uS(null);const [csvOpen,setCsvOpen]=uS(false);
  const [selMode,setSelMode]=uS(false);const [sel,setSel]=uS([]);const [bulkOpen,setBulkOpen]=uS(false);
  const [loading,setLoading]=uS(true);

  async function load(){
    setLoading(true);
    const [m,c,ls]=await Promise.all([
      sb.from("materials").select("*").eq("org_id",profile.org_id).is("deleted_at",null),
      sb.from("categories").select("name").eq("org_id",profile.org_id).order("name"),
      sb.from("location_stock").select("*").eq("org_id",profile.org_id),
    ]);
    setMaterials(byName(m.data||[]));setCats((c.data||[]).map(x=>x.name));setLocStock(ls.data||[]);setLoading(false);
  }
  uE(()=>{load();},[profile.org_id]);

  function stockFor(matId,loc){
    if(loc==="All"){const rows=locStock.filter(x=>x.material_id===matId);return rows.reduce((s,r)=>s+r.stock,0);}
    return locStock.find(x=>x.material_id===matId&&x.location===loc)?.stock||0;
  }
  function costFor(matId,loc){
    if(loc==="All"){const rows=locStock.filter(x=>x.material_id===matId);return rows.length?rows[0].cost:0;}
    return locStock.find(x=>x.material_id===matId&&x.location===loc)?.cost||0;
  }

  const filtered=materials.filter(m=>(catFilt==="All"||m.category===catFilt)&&(!search||m.name.toLowerCase().includes(search.toLowerCase())||m.sku.toLowerCase().includes(search.toLowerCase())));

  async function deleteMat(m){
    await sb.from("materials").update({deleted_at:new Date().toISOString()}).eq("id",m.id);
    await logActivity(profile.org_id,profile.id,"Material deleted",m.name);showToast("Moved to trash");load();
  }

  async function bulkDelete(){
    await sb.from("materials").update({deleted_at:new Date().toISOString()}).in("id",sel);
    showToast("Deleted "+sel.length);setSel([]);setSelMode(false);load();
  }

  function exportCSV(){
    const rows=[["SKU","Name","Category","Supplier","Charleston Stock","Charleston Stock","Cost","Low Threshold","Unit"]];
    filtered.forEach(m=>{rows.push([m.sku,m.name,m.category||"",m.supplier||"",stockFor(m.id,"Charleston"),stockFor(m.id,"Charleston"),costFor(m.id,locFilt==="All"?"Charleston":locFilt),m.low_threshold,m.unit]);});
    const csv=rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
    const fn="materials-"+new Date().toISOString().slice(0,10)+".csv";
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});
    try{if(navigator.canShare){const f=new File([blob],fn,{type:"text/csv"});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:fn});return;}}}catch(_){}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
    showToast("CSV exported");
  }

        {["All",...cats].map(c=><button key={c} className={"pill"+(catFilt===c?" active":"")} onClick={()=>setCatFilt(c)}>{c}</button>)}
      </div>
      <div className="row" style={{marginBottom:14,gap:6}}>
        {["All",...LOCATIONS].map(l=><button key={l} className={"pill"+(locFilt===l?" active":"")} onClick={()=>setLocFilt(l)}>{l==="All"?"All Locations":l}</button>)}
      </div>

      {selMode&&sel.length>0&&(
        <div className="card row" style={{borderColor:C.orange,marginBottom:12}}>
          <span style={{fontWeight:700}}>{sel.length} selected</span>

          <button className="btn btn-danger" style={{fontSize:12,padding:"6px 12px"}} onClick={bulkDelete}>Delete</button>

        {filtered.map(m=>{

          const low=totalStock>0&&totalStock<m.low_threshold;const out=totalStock===0;
          const checked=sel.includes(m.id);
          return(
            <div key={m.id} onClick={selMode?()=>setSel(p=>p.includes(m.id)?p.filter(x=>x!==m.id):[...p,m.id]):undefined}

              <div style={{flex:1,minWidth:180}}>
                <div className="row" style={{gap:8,marginBottom:3}}>

                  <span>${costFor(m.id,"Charleston").toFixed(2)}/{m.unit}</span>

              {!selMode&&<button className="btn btn-ghost" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setEditing(m)}>Edit</button>}
              {!selMode&&<button className="btn btn-danger" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>deleteMat(m)}>Delete</button>}
            </div>
          );
        })}
        {filtered.length===0&&<div style={{textAlign:"center",marginTop:60,color:C.muted}}>No materials. Add one or import a CSV.</div>}
      </div>

      {editing&&<MatModal profile={profile} mat={editing.id?editing:null} cats={cats} locStock={locStock} onClose={()=>setEditing(null)} onDone={()=>{load();setEditing(null);}} showToast={showToast}/>}
      {transferring&&<TransferModal profile={profile} mat={transferring} locStock={locStock} onClose={()=>setTransferring(null)} onDone={()=>{load();setTransferring(null);}} showToast={showToast}/>}
      {csvOpen&&<CSVImportModal profile={profile} materials={materials} locStock={locStock} onClose={()=>setCsvOpen(false)} onDone={()=>{load();setCsvOpen(false);}} showToast={showToast}/>}
      {bulkOpen&&<BulkEditModal ids={sel} cats={cats} onClose={()=>setBulkOpen(false)} onDone={()=>{load();setSel([]);setSelMode(false);setBulkOpen(false);}} showToast={showToast}/>}
    </div>
  );
}

function TransferModal({profile,mat,locStock,onClose,onDone,showToast}){
  const C=DARK;
  const [from,setFrom]=uS("Charleston");const [to,setTo]=uS("Charleston");const [qty,setQty]=uS("");const [notes,setNotes]=uS("");const [busy,setBusy]=uS(false);const [err,setErr]=uS("");
  const fromStock=locStock.find(x=>x.material_id===mat.id&&x.location===from)?.stock||0;

  async function submit(){
    const q=parseFloat(qty);if(!q||q<=0){setErr("Enter a valid quantity");return;}if(q>fromStock){setErr("Not enough stock in "+from);return;}
    setBusy(true);
    try{
      await sb.from("location_stock").upsert({org_id:profile.org_id,material_id:mat.id,location:from,stock:fromStock-q},{onConflict:"material_id,location"});
      const toStock=locStock.find(x=>x.material_id===mat.id&&x.location===to)?.stock||0;
      await sb.from("location_stock").upsert({org_id:profile.org_id,material_id:mat.id,location:to,stock:toStock+q},{onConflict:"material_id,location"});
      await sb.from("stock_transfers").insert({org_id:profile.org_id,material_id:mat.id,from_location:from,to_location:to,qty:q,notes:notes||null});

function CSVImportModal({profile,materials,locStock,onClose,onDone,showToast}){

function POModal({profile,order,materials,onClose,onDone,showToast}){
  const C=DARK;
  const [f,setF]=uS(order?{supplier:order.supplier||"",po_number:order.po_number||"",order_date:order.order_date||"",expected_date:order.expected_date||"",location:order.location||"Charleston",status:order.status||"Ordered",notes:order.notes||""}:{supplier:"",po_number:"",order_date:new Date().toISOString().slice(0,10),expected_date:"",location:"Charleston",status:"Ordered",notes:""});
  const [items,setItems]=uS([]);const [newItem,setNewItem]=uS({material_id:"",material_name:"",ordered_qty:"",unit_cost:""});
  const [busy,setBusy]=uS(false);const [err,setErr]=uS("");

  uE(()=>{if(order?.id){sb.from("po_items").select("*").eq("po_id",order.id).then(({data})=>setItems(data||[]));};},[order?.id]);

      let orderId=order?.id;
      if(order?.id){await sb.from("purchase_orders").update({supplier:f.supplier,po_number:f.po_number||null,order_date:f.order_date||null,expected_date:f.expected_date||null,location:f.location,status:f.status,notes:f.notes||null}).eq("id",order.id);}
      else{const {data}=await sb.from("purchase_orders").insert({org_id:profile.org_id,supplier:f.supplier,po_number:f.po_number||null,order_date:f.order_date||null,expected_date:f.expected_date||null,location:f.location,status:f.status,notes:f.notes||null}).select("id").single();orderId=data?.id;}
      for(const it of items.filter(x=>!x.id)){await sb.from("po_items").insert({po_id:orderId,material_id:it.material_id||null,material_name:it.material_name,ordered_qty:parseFloat(it.ordered_qty)||0,unit_cost:parseFloat(it.unit_cost)||null,received_qty:0});}

    return new Promise((res,rej)=>{
      if(file.type==="application/pdf"){const r=new FileReader();r.onload=()=>res({data:String(r.result).split(",")[1],mediaType:"application/pdf"});r.onerror=()=>rej(new Error("Could not read file"));r.readAsDataURL(file);return;}
      const url=URL.createObjectURL(file);const img=new Image();
      img.onload=()=>{const s=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({data:c.toDataURL("image/jpeg",0.85).split(",")[1],mediaType:"image/jpeg"});};
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Could not read that image"));};
      img.src=url;
    });
  }

          return {material_id:mat?mat.id:"",material_name:mat?mat.name:i.name,ordered_qty:String(i.qty),unit_cost:"",received_qty:0};
        });
        setItems(prev=>[...prev,...added]);
        setF(prev=>({...prev,supplier:prev.supplier||data.supplier||"",po_number:prev.po_number||data.po_number||""}));
        showToast("Scanned "+added.length+" items. Review, then save.");
      }
    }catch(ex){setErr("Scan failed: "+ex.message);}
    setScanning(false);

  function addItem(){

  return(

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div><div className="lbl">Supplier</div><input value={f.supplier} onChange={e=>setF({...f,supplier:e.target.value})} placeholder="Stone Source"/></div>
          <div><div className="lbl">PO Number</div><input value={f.po_number} onChange={e=>setF({...f,po_number:e.target.value})} placeholder="PO-2024-001"/></div>
          <div><div className="lbl">Order date</div><input type="date" value={f.order_date} onChange={e=>setF({...f,order_date:e.target.value})}/></div>
          <div><div className="lbl">Expected date</div><input type="date" value={f.expected_date} onChange={e=>setF({...f,expected_date:e.target.value})}/></div>
          <div><div className="lbl">Location</div><select value={f.location} onChange={e=>setF({...f,location:e.target.value})}>{LOCATIONS.map(l=><option key={l}>{l}</option>)}</select></div>
          <div><div className="lbl">Status</div><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{["Ordered","Partial","Received","Cancelled"].map(s=><option key={s}>{s}</option>)}</select></div>
        </div>
        <div style={{marginBottom:14}}>
          <label className="btn btn-green" style={{display:"block",textAlign:"center",marginBottom:12,cursor:scanning?"default":"pointer",opacity:scanning?.6:1}}>
            {scanning?"Scanning... (up to a minute)":"Scan PO (photo or PDF)"}
            <input type="file" style={{display:"none"}} disabled={scanning} onChange={scanFile}/>
          </label>
          <div className="lbl">Items</div>
          {items.map((it,i)=>(
            <div key={i} className="row" style={{background:C.surface,borderRadius:8,padding:"8px 10px",marginBottom:6,fontSize:12}}>
              <span style={{flex:1}}>{it.material_name}</span>

              {it.unit_cost&&<span className="muted">${it.unit_cost}/unit</span>}

function ReceiveModal({profile,order,materials,onClose,onDone,showToast}){
  const C=DARK;
  const [items,setItems]=uS([]);const [busy,setBusy]=uS(false);

  uE(()=>{sb.from("po_items").select("*").eq("po_id",order.id).then(({data})=>setItems((data||[]).map(it=>({...it,receiving:""}))));},[ order.id]);

  async function apply(){
    setBusy(true);
    try{
      let allReceived=true;let anyReceived=false;
      for(const it of items){
        const recv=parseFloat(it.receiving)||0;if(!recv)continue;
        anyReceived=true;
        const newRecv=it.received_qty+recv;
        await sb.from("po_items").update({received_qty:newRecv,received_at:new Date().toISOString()}).eq("id",it.id);
        // Update location stock
        if(it.material_id){
          const {data:ls}=await sb.from("location_stock").select("id,stock").eq("material_id",it.material_id).eq("location",order.location).maybeSingle();
          if(ls){await sb.from("location_stock").update({stock:ls.stock+recv}).eq("id",ls.id);}
          else{await sb.from("location_stock").insert({org_id:profile.org_id,material_id:it.material_id,location:order.location,stock:recv,cost:it.unit_cost||0});}
        }
        if(newRecv<it.ordered_qty) allReceived=false;
      }
      const newStatus=allReceived?"Received":anyReceived?"Partial":"Ordered";
      await sb.from("purchase_orders").update({status:newStatus}).eq("id",order.id);
      await logActivity(profile.org_id,profile.id,"PO received",order.supplier+" ("+order.po_number+")");
      showToast("Items received and stock updated");onDone();
    }catch(e){console.error(e);}setBusy(false);
  }

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="row" style={{marginBottom:18}}><h3 style={{flex:1}}>Receive Items - {order.supplier}</h3><button className="btn btn-ghost" style={{padding:"4px 10px"}} onClick={onClose}>x</button></div>
        <div className="muted" style={{fontSize:12,marginBottom:14}}>Enter the quantity received for each item. Stock will be updated automatically.</div>
        {items.map((it,i)=>(
          <div key={it.id} style={{background:C.surface,borderRadius:9,padding:"12px 14px",marginBottom:10}}>
            <div className="row" style={{marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13}}>{it.material_name}</div>
                <div className="muted" style={{fontSize:11}}>Ordered: {it.ordered_qty} . Already received: {it.received_qty}</div>
              </div>
              <span className="tag" style={{background:it.received_qty>=it.ordered_qty?C.greenBg:C.yellowBg,color:it.received_qty>=it.ordered_qty?C.green:C.yellow}}>
                {it.received_qty>=it.ordered_qty?"Complete":"Pending"}
              </span>
            </div>
            <div className="row">
              <div className="lbl" style={{marginBottom:0,marginRight:8}}>Receiving now:</div>
              <input type="number" value={it.receiving||""} onChange={e=>setItems(items.map((x,xi)=>xi===i?{...x,receiving:e.target.value}:x))} placeholder="0" style={{width:100}}/>
              <button onClick={()=>setItems(items.map((x,xi)=>xi===i?{...x,receiving:String(x.ordered_qty-x.received_qty)}:x))} className="btn btn-ghost" style={{fontSize:11,padding:"5px 10px"}}>All remaining</button>
            </div>
          </div>
        ))}
        <button className="btn btn-primary" style={{width:"100%"}} disabled={busy} onClick={apply}>{busy?"Processing...":"Receive & update stock"}</button>
      </div>
    </div>
  );
}

function AddMatRowSchedule({jobId,materials,onDone,showToast}){

// - Cuts: what to cut and when -
function ymd(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function cutSqft(c){return ((parseFloat(c.width)||0)*(parseFloat(c.height)||0)*(c.qty||1))/144;}
function cutDayLabel(ds){
  if(!ds)return "Unscheduled";
  const t=new Date();const today=ymd(t);const tm=new Date(t);tm.setDate(tm.getDate()+1);
  const d=new Date(ds+"T12:00:00");const nice=d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  if(ds<today)return "Overdue - "+nice;if(ds===today)return "Today - "+nice;if(ds===ymd(tm))return "Tomorrow - "+nice;return nice;
}

function CutsTab({profile,showToast,addTick}){

  async function load(){

      sb.from("jobs").select("id,name").eq("org_id",profile.org_id).is("deleted_at",null).order("name"),
      sb.from("materials").select("id,name,sku").eq("org_id",profile.org_id).is("deleted_at",null).order("name"),
      sb.from("profiles").select("id,full_name").eq("org_id",profile.org_id).order("full_name")

  }
  uE(()=>{load();},[profile.org_id]);

  const jobName=id=>(jobs.find(j=>j.id===id)||{}).name||"";
  const matName=id=>(materials.find(m=>m.id===id)||{}).name||"";
  const who=id=>(profiles.find(p=>p.id===id)||{}).full_name||"";

    showToast(done?"Marked as cut":"Moved back to To Cut");load();

  });

        ))}

        {overdue>0&&<span className="tag" style={{background:C.redBg,color:C.red}}>{overdue} overdue</span>}
      </div>

      {keys.map(k=>{
        const list=groups[k];const sq=list.reduce((s,c)=>s+cutSqft(c),0);
        const late=k!=="none"&&k<today&&view!=="done";

          <div key={k} style={{marginBottom:18}}>

              <span className="muted" style={{fontSize:12}}>{list.length} cut{list.length===1?"":"s"} . {sq.toFixed(1)} sqft</span>

                      {(c.width||c.height)&&<span>{c.width||"?"} x {c.height||"?"} in ({cutSqft(c).toFixed(1)} sqft)</span>}

                  </div>

                  <button className="btn btn-danger" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>del(c)}>Delete</button>
                </div>
              );
            })}
          </div>
        );
      })}
      {shown.length===0&&<div style={{textAlign:"center",marginTop:60,color:C.muted}}>{view==="done"?"Nothing cut yet.":"No cuts to make. Tap + Add Cut."}</div>}
      {editing&&<CutModal profile={profile} cut={editing.id?editing:null} jobs={jobs} materials={materials} profiles={profiles} onClose={()=>setEditing(null)} onDone={()=>{load();setEditing(null);}} showToast={showToast}/>}
    </div>
  );

function CutModal({profile,cut,jobs,materials,profiles,onClose,onDone,showToast}){
  const C=DARK;
  const [f,setF]=uS(cut?{piece:cut.piece,job_id:cut.job_id||"",material_id:cut.material_id||"",width:cut.width==null?"":String(cut.width),height:cut.height==null?"":String(cut.height),qty:String(cut.qty||1),cut_date:cut.cut_date||"",assigned_to:cut.assigned_to||"",notes:cut.notes||""}:{piece:"",job_id:"",material_id:"",width:"",height:"",qty:"1",cut_date:ymd(new Date()),assigned_to:"",notes:""});
  const [busy,setBusy]=uS(false);const [err,setErr]=uS("");
  async function submit(){
    if(!f.piece.trim()){setErr("Describe the piece (e.g. Kitchen island top)");return;}
    setBusy(true);
    const row={piece:f.piece.trim(),job_id:f.job_id||null,material_id:f.material_id||null,width:parseFloat(f.width)||null,height:parseFloat(f.height)||null,qty:parseInt(f.qty,10)||1,cut_date:f.cut_date||null,assigned_to:f.assigned_to||null,notes:f.notes||null};
    try{
      const res=cut?await sb.from("cuts").update(row).eq("id",cut.id):await sb.from("cuts").insert({...row,org_id:profile.org_id});
      if(res.error)throw res.error;
      showToast(cut?"Cut updated":"Cut added");onDone();
    }catch(e){setErr(e.message);}setBusy(false);
  }
  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="row" style={{marginBottom:18}}><h3 style={{flex:1}}>{cut?"Edit Cut":"Add Cut"}</h3><button className="btn btn-ghost" style={{padding:"4px 10px"}} onClick={onClose}>x</button></div>
        <div className="section"><div className="lbl">Piece</div><input value={f.piece} onChange={e=>setF({...f,piece:e.target.value})} placeholder="Kitchen island top"/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <div><div className="lbl">Width (in)</div><input type="number" value={f.width} onChange={e=>setF({...f,width:e.target.value})}/></div>
          <div><div className="lbl">Length (in)</div><input type="number" value={f.height} onChange={e=>setF({...f,height:e.target.value})}/></div>
          <div><div className="lbl">Qty</div><input type="number" value={f.qty} onChange={e=>setF({...f,qty:e.target.value})}/></div>
        </div>
        <div className="section"><div className="lbl">Cut date</div><input type="date" value={f.cut_date} onChange={e=>setF({...f,cut_date:e.target.value})}/></div>
        <div className="section"><div className="lbl">Material</div>
          <select value={f.material_id} onChange={e=>setF({...f,material_id:e.target.value})}><option value="">- None -</option>{materials.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
        <div className="section"><div className="lbl">Job</div>
          <select value={f.job_id} onChange={e=>setF({...f,job_id:e.target.value})}><option value="">- None -</option>{jobs.map(j=><option key={j.id} value={j.id}>{j.name}</option>)}</select></div>
        <div className="section"><div className="lbl">Cutter</div>
          <select value={f.assigned_to} onChange={e=>setF({...f,assigned_to:e.target.value})}><option value="">- Anyone -</option>{profiles.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}</select></div>
        <div className="section"><div className="lbl">Notes</div><input value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} placeholder="Sink cutout, 3cm eased edge..."/></div>
        {err&&<div style={{color:C.red,fontSize:12,marginBottom:10}}>{err}</div>}
        <button className="btn btn-primary" style={{width:"100%"}} disabled={busy} onClick={submit}>{busy?"Saving...":cut?"Save changes":"Add cut"}</button>
      </div>
    </div>
  );
}

let _toastTimer=null;
function showToast(msg){
  const el=document.getElementById("toast");if(!el)return;
  el.textContent=msg;el.style.display="block";
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{el.style.display="none";},2800);
}

function AppShell(){
  const {session,profile,reload}=useAuth();
  const [tab,setTab]=uS2("schedule");const [addTick,setAddTick]=uS2(0);

  const adminAllowed=profile&&isAdmin(profile.role);

  const tabs=[
    {key:"schedule",label:"Schedule"},
    {key:"cuts",label:"Cuts"},
    {key:"materials",label:"Materials"},
    {key:"slabs",label:"Slabs"},
    {key:"fabrication",label:"Fabrication"},
    {key:"receiving",label:"Receiving"},
    {key:"quotes",label:"Quotes"},
    {key:"clients",label:"Clients"},
    ...(adminAllowed?[{key:"admin",label:"Admin"}]:[]),
  ];

  if(!session||!profile) return React.createElement(LoginScreen);

  return(
    <div>
      {/* Header */}
      <div id="header">
        <div className="row">
          <img src={LOGO} alt="" style={{width:36,height:36,borderRadius:8}}/>
          <div style={{flex:1}}><div className="title">Superior Stone</div><div className="muted" style={{fontSize:12}}>{profile.full_name} . {RLBL[profile.role]||profile.role}</div></div>
          <button className="btn btn-ghost" style={{fontSize:12,padding:"6px 10px"}} onClick={()=>sb.auth.signOut()}>Sign out</button>
        </div>
        <div id="tabs">
          {tabs.map(t=>(
            <button key={t.key} className={"tab-btn"+(tab===t.key?" active":"")} onClick={()=>{setTab(t.key);setAddTick(0);}}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* Tab content */}
      {tab==="schedule"&&React.createElement(ScheduleTab,{profile,showToast,addTick})}
      {tab==="cuts"&&React.createElement(CutsTab,{profile,showToast,addTick})}
      {tab==="materials"&&React.createElement(MaterialsTab,{profile,showToast})}
      {tab==="slabs"&&React.createElement(SlabsTab,{profile,showToast,addTick})}
      {tab==="fabrication"&&React.createElement(FabricationTab,{profile,showToast})}
      {tab==="receiving"&&React.createElement(ReceivingTab,{profile,showToast,addTick})}
      {tab==="quotes"&&React.createElement(QuotesTab,{profile,showToast,addTick})}
      {tab==="clients"&&React.createElement(ClientsTab,{profile,showToast,addTick})}
      {tab==="admin"&&adminAllowed&&React.createElement(AdminTab,{profile,showToast})}

      {/* FAB button */}
      {(tab==="schedule"||tab==="cuts"||tab==="clients"||tab==="quotes"||tab==="receiving"||tab==="slabs")&&(
        <button className="fab" onClick={()=>{
          setAddTick(n=>n+1);
        }}>+</button>
      )}
    </div>
  );
}

          <div style={{background:C.card,border:"1px solid "+C.orange,borderRadius:16,padding:24}}>

    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-screen').style.display = 'block';
    document.getElementById('error-title').textContent = 'Compile Error';
    document.getElementById('error-msg').textContent = e.message || String(e);
  }
})();
