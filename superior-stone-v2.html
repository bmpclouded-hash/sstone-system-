<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Superior Stone</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext} = React;

// ═══════════════════════════════════════════════════════════════════════════════
// CONFIGURATION — paste your Supabase values here
// Get these from: supabase.com → your project → Project Settings → API
// ═══════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL  = "YOUR_SUPABASE_URL";   // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON = "YOUR_SUPABASE_ANON_KEY"; // starts with eyJ...

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Themes ────────────────────────────────────────────────────────────────────
const DARK  = {bg:"#1a1a17",surface:"#232320",card:"#2a2a26",border:"#38382f",orange:"#d4642a",text:"#f0ede8",muted:"#8a8880",dim:"#5a5955",red:"#c0392b",yellow:"#c8960a",green:"#2d7a45",redBg:"#2c1a18",yellowBg:"#2c2410",greenBg:"#182c20"};
const LIGHT = {bg:"#faf8f5",surface:"#fff",card:"#fff",border:"#e2ddd3",orange:"#c4561f",text:"#2a2722",muted:"#766f63",dim:"#9a9489",red:"#b6362a",yellow:"#a8740a",green:"#236b3a",redBg:"#fbeae8",yellowBg:"#fcf2dc",greenBg:"#e7f4ea"};
const ThemeCtx = createContext(DARK);
const useT = () => useContext(ThemeCtx);

// ── Constants ────────────────────────────────────────────────────────────────
const ROLES      = ["operations_manager","estimator","project_manager","fabricator","installer","delivery_crew"];
const RLBL       = {operations_manager:"Operations Manager",estimator:"Estimator",project_manager:"Project Manager",fabricator:"Fabricator",installer:"Install Crew",delivery_crew:"Delivery Crew"};
const ADMIN_R    = ["operations_manager","estimator","project_manager"];
const STATUSES   = ["Scheduled","In progress","Complete"];
const LOCATIONS = ["Charleston"];
const FAB_STATS  = ["Queued","In Fab","Cut","Polished","Ready"];
const DEFAULT_TH = 700;

// ── Helpers ───────────────────────────────────────────────────────────────────
const byName  = arr => [...arr].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
const isLow   = m   => m.stock>0 && m.stock<(m.low_threshold||DEFAULT_TH);
const uLabel  = (m,gu) => (m&&m.unit==="units")?"units":gu;
const fmtD    = d   => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
const ago     = iso => {const m=Math.floor((Date.now()-new Date(iso))/60000);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";};
const toNum   = v   => {if(v==null)return null;if(typeof v==="number")return isFinite(v)?v:null;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:null;};

// ── Spreadsheet helpers ───────────────────────────────────────────────────────
function detectDelim(text){const first=(String(text).replace(/^\uFEFF/,"").split(/\r?\n/).find(l=>l.trim()!=="")||"");const counts={",":0,"\t":0,";":0};let inQ=false;for(const ch of first){if(ch==='"'){inQ=!inQ;continue;}if(!inQ&&counts[ch]!==undefined)counts[ch]++;}let best=",",n=0;for(const d in counts)if(counts[d]>n){n=counts[d];best=d;}return best;}
function parseGrid(text){const rows=[];let field="",row=[],inQ=false,i=0;text=String(text).replace(/^\uFEFF/,"");const D=detectDelim(text);while(i<text.length){const c=text[i];if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=c;i++;continue;}if(c==='"'){inQ=true;i++;continue;}if(c===D){row.push(field);field="";i++;continue;}if(c==='\r'){i++;continue;}if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}field+=c;i++;}if(field.length||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()!==""));}
const HMAP={sku:"sku",id:"sku",code:"sku",material:"name",name:"name",description:"name",item:"name",product:"name",quantity:"qty",qty:"qty",stock:"qty",onhand:"qty",sqft:"qty",cost:"cost",price:"cost",unitcost:"cost",category:"cat",cat:"cat",type:"cat",supplier:"supplier",vendor:"supplier"};
function rowsFromGrid(grid){if(grid.length<2)return[];const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");const headers=grid[0].map(h=>HMAP[norm(h)]||null);const out=[];for(let r=1;r<grid.length;r++){const o={};headers.forEach((k,ci)=>{if(k&&grid[r][ci]!==undefined)o[k]=String(grid[r][ci]).trim();});const name=o.name||o.sku||"";const qty=toNum(o.qty);if(!name||qty==null||qty<=0)continue;out.push({name,qty,sku:o.sku,cost:toNum(o.cost)});}return out;}

// ── Primitives ────────────────────────────────────────────────────────────────
function Pill({label,active,onClick}){const C=useT();return <button onClick={onClick} style={{background:active?C.orange:"transparent",color:active?"#fff":C.muted,border:"1.5px solid "+(active?C.orange:C.border),borderRadius:999,padding:"5px 16px",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{label}</button>;}
function Inp({style,...p}){const C=useT();return <input style={{background:C.surface,border:"1.5px solid "+C.border,borderRadius:8,padding:"10px 14px",fontSize:14,color:C.text,outline:"none",width:"100%",...style}} {...p}/>;}
function Sel({style,children,...p}){const C=useT();return <select style={{background:C.surface,border:"1.5px solid "+C.border,borderRadius:8,padding:"10px 14px",fontSize:14,color:C.text,outline:"none",width:"100%",...style}} {...p}>{children}</select>;}
function Lbl({children}){const C=useT();return <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.07em",textTransform:"uppercase",color:C.muted,marginBottom:5}}>{children}</div>;}
function Modal({title,onClose,children}){const C=useT();return(
  <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:28,maxWidth:560,width:"100%",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{fontWeight:700,fontSize:18,color:C.text}}>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:26,cursor:"pointer",lineHeight:1}}>×</button>
      </div>
      {children}
    </div>
  </div>
);}
function SyncDot({state}){const C=useT();const m={loading:{c:C.muted,l:"Loading"},saving:{c:C.yellow,l:"Syncing"},saved:{c:C.green,l:"Synced"},error:{c:C.red,l:"Error"}};const s=m[state]||m.saved;return <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:s.c,fontWeight:600}}><span style={{width:6,height:6,borderRadius:"50%",background:s.c,display:"inline-block"}}/>{s.l}</div>;}

// ═══════════════════════════════════════════════════════════════════════════════
// AUTH SCREENS
// ═══════════════════════════════════════════════════════════════════════════════
function AuthScreen({onAuth}){
  const C=useT();
  const [mode,setMode]=useState("signin");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [name,setName]=useState("");
  const [company,setCompany]=useState("");
  const [joinCode,setJoinCode]=useState("");
  const [orgMode,setOrgMode]=useState("create");
  const [step,setStep]=useState("auth");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [info,setInfo]=useState("");

  async function submitAuth(){
    setErr("");setInfo("");setBusy(true);
    try{
      if(mode==="signin"){
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
        if(error)throw error;
      } else {
        const {data,error}=await sb.auth.signUp({email:email.trim(),password:pw});
        if(error)throw error;
        if(!data.session){setInfo("Check your email to confirm, then sign in.");setBusy(false);setMode("signin");return;}
        setStep("org");
      }
    }catch(e){setErr(e.message);}
    setBusy(false);
  }

  async function submitOrg(){
    setErr("");setBusy(true);
    try{
      if(!name.trim())throw new Error("Enter your name");
      if(orgMode==="create"){
        if(!company.trim())throw new Error("Enter a company name");
        const {error}=await sb.rpc("create_company",{p_company:company.trim(),p_name:name.trim()});
        if(error)throw error;
      } else {
        if(!joinCode.trim())throw new Error("Enter a join code");
        const {error}=await sb.rpc("join_company",{p_org:joinCode.trim(),p_name:name.trim()});
        if(error)throw error;
      }
      onAuth();
    }catch(e){setErr(e.message);}
    setBusy(false);
  }

  return(
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:36}}>🟧</div>
          <div style={{fontWeight:800,fontSize:24,color:C.text,marginTop:8}}>Superior Stone</div>
          <div style={{color:C.muted,fontSize:13,marginTop:4}}>Stone fabrication management</div>
        </div>

        {step==="auth"&&(
          <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:24}}>
            <div style={{display:"flex",gap:4,marginBottom:18}}>
              {["signin","signup"].map(m=>(
                <button key={m} onClick={()=>{setMode(m);setErr("");setInfo("");}} style={{flex:1,background:mode===m?C.orange:"transparent",color:mode===m?"#fff":C.muted,border:"1.5px solid "+(mode===m?C.orange:C.border),borderRadius:8,padding:"9px",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  {m==="signin"?"Sign in":"Create account"}
                </button>
              ))}
            </div>
            <div style={{marginBottom:12}}><Lbl>Email</Lbl><Inp type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com"/></div>
            <div style={{marginBottom:16}}><Lbl>Password</Lbl><Inp type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submitAuth()} placeholder="6+ characters"/></div>
            {err&&<div style={{color:C.red,fontSize:12,marginBottom:12}}>{err}</div>}
            {info&&<div style={{color:C.green,fontSize:12,marginBottom:12}}>{info}</div>}
            <button onClick={submitAuth} disabled={busy||!email||!pw} style={{width:"100%",background:(busy||!email||!pw)?C.surface:C.orange,color:(busy||!email||!pw)?C.dim:"#fff",border:"none",borderRadius:9,padding:"13px",fontWeight:700,fontSize:15,cursor:(busy||!email||!pw)?"default":"pointer"}}>
              {busy?"…":mode==="signin"?"Sign in":"Create account"}
            </button>
          </div>
        )}

        {step==="org"&&(
          <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:16,padding:24}}>
            <div style={{color:C.muted,fontSize:13,marginBottom:16}}>One more step — set up your company.</div>
            <div style={{display:"flex",gap:4,marginBottom:16}}>
              {[["create","New company"],["join","Join with code"]].map(([v,l])=>(
                <button key={v} onClick={()=>setOrgMode(v)} style={{flex:1,background:orgMode===v?C.orange:"transparent",color:orgMode===v?"#fff":C.muted,border:"1.5px solid "+(orgMode===v?C.orange:C.border),borderRadius:8,padding:"9px",fontWeight:700,fontSize:13,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            <div style={{marginBottom:12}}><Lbl>Your name</Lbl><Inp value={name} onChange={e=>setName(e.target.value)} placeholder="First Last"/></div>
            {orgMode==="create"
              ?<div style={{marginBottom:16}}><Lbl>Company name</Lbl><Inp value={company} onChange={e=>setCompany(e.target.value)} placeholder="Superior Stone of the Southeast"/></div>
              :<div style={{marginBottom:16}}><Lbl>Join code</Lbl><Inp value={joinCode} onChange={e=>setJoinCode(e.target.value)} placeholder="Paste the code your manager shared"/><div style={{color:C.dim,fontSize:11,marginTop:6}}>An admin can find this on the Admin tab.</div></div>
            }
            {err&&<div style={{color:C.red,fontSize:12,marginBottom:12}}>{err}</div>}
            <button onClick={submitOrg} disabled={busy} style={{width:"100%",background:busy?C.surface:C.orange,color:busy?C.dim:"#fff",border:"none",borderRadius:9,padding:"13px",fontWeight:700,fontSize:15,cursor:busy?"default":"pointer"}}>
              {busy?"…":orgMode==="create"?"Create company":"Join company"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// MATERIAL MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function MatModal({mat,cats,orgId,onClose,onDone,showToast}){
  const C=useT();
  const [f,setF]=useState(mat?{...mat,stock:String(mat.stock),cost:String(mat.cost),low_threshold:String(mat.low_threshold)}:{sku:"",name:"",cat:"",supplier:"",stock:"",cost:"",unit:"sqft",low_threshold:String(DEFAULT_TH)});
  const [newCat,setNewCat]=useState("");const [addCat,setAddCat]=useState(false);
  const [busy,setBusy]=useState(false);const [err,setErr]=useState("");
  const um=f.unit==="units"?"units":"sqft";

  async function addCategory(){const v=newCat.trim();if(!v)return;await sb.from("categories").upsert({org_id:orgId,name:v},{onConflict:"org_id,name"});setF({...f,cat:v});setNewCat("");setAddCat(false);onDone();}

  async function submit(){
    setErr("");
    if(!f.name.trim()){setErr("Name is required.");return;}
    if(!mat&&!f.sku.trim()){setErr("SKU is required.");return;}
    if(f.stock===""||f.cost===""){setErr("Stock and cost are required.");return;}
    setBusy(true);
    try{
      if(mat){
        const {error}=await sb.from("materials").update({name:f.name.trim(),category:f.cat||null,supplier:f.supplier.trim()||null,stock:parseFloat(f.stock),cost:parseFloat(f.cost),unit:f.unit,low_threshold:parseFloat(f.low_threshold)||DEFAULT_TH}).eq("id",mat.id);
        if(error)throw error;showToast("Material updated");
      }else{
        const {error}=await sb.from("materials").insert({org_id:orgId,sku:f.sku.trim().toUpperCase(),name:f.name.trim(),category:f.cat||null,supplier:f.supplier.trim()||null,stock:parseFloat(f.stock),cost:parseFloat(f.cost),unit:f.unit||"sqft",low_threshold:parseFloat(f.low_threshold)||DEFAULT_TH});
        if(error){if(error.code==="23505"){setErr("That SKU already exists.");setBusy(false);return;}throw error;}showToast("Material added");
      }
      await onDone();onClose();
    }catch(e){setErr(e.message);}setBusy(false);
  }

  return(
    <Modal title={mat?"Edit material":"Add material"} onClose={onClose}>
      {!mat&&<div style={{marginBottom:14}}><Lbl>SKU</Lbl><Inp value={f.sku} placeholder="e.g. TW3" onChange={e=>setF({...f,sku:e.target.value})}/></div>}
      <div style={{marginBottom:14}}><Lbl>Material name</Lbl><Inp value={f.name} placeholder="Travertine Silver 12x24" onChange={e=>setF({...f,name:e.target.value})}/></div>
      <div style={{marginBottom:14}}><Lbl>Category</Lbl>
        {!addCat
          ?<div style={{display:"flex",gap:8}}><Sel value={f.cat} onChange={e=>setF({...f,cat:e.target.value})} style={{flex:1}}><option value="">— None —</option>{cats.map(c=><option key={c}>{c}</option>)}</Sel><button onClick={()=>setAddCat(true)} style={{background:"transparent",border:"1.5px solid "+C.orange,color:C.orange,borderRadius:8,padding:"0 14px",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>+ New</button></div>
          :<div style={{display:"flex",gap:8}}><Inp value={newCat} autoFocus placeholder="New category" onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCategory()}/><button onClick={addCategory} style={{background:C.orange,border:"none",color:"#fff",borderRadius:8,padding:"0 16px",fontWeight:700,fontSize:13,cursor:"pointer"}}>Add</button><button onClick={()=>{setAddCat(false);setNewCat("");}} style={{background:"transparent",border:"1.5px solid "+C.border,color:C.muted,borderRadius:8,padding:"0 12px",fontWeight:700,fontSize:13,cursor:"pointer"}}>×</button></div>
        }
      </div>
      <div style={{marginBottom:14}}><Lbl>Supplier</Lbl><Inp value={f.supplier} placeholder="Stone Source" onChange={e=>setF({...f,supplier:e.target.value})}/></div>
      <div style={{marginBottom:14}}><Lbl>Measured in</Lbl>
        <div style={{display:"flex",gap:8}}>
          {[["sqft","Square Feet"],["units","Units (count)"]].map(([v,l])=>(
            <button key={v} onClick={()=>setF({...f,unit:v})} style={{flex:1,padding:"9px",borderRadius:8,cursor:"pointer",border:"1.5px solid "+(f.unit===v?C.orange:C.border),background:f.unit===v?C.surface:"transparent",color:f.unit===v?C.orange:C.muted,fontWeight:700,fontSize:13}}>{l}</button>
          ))}
        </div>
        <div style={{color:C.dim,fontSize:11,marginTop:6}}>Use Units for items you count one at a time (sinks, slabs, faucets).</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <div><Lbl>Stock ({um})</Lbl><Inp type="number" value={f.stock} onChange={e=>setF({...f,stock:e.target.value})}/></div>
        <div><Lbl>Cost per {um} ($)</Lbl><Inp type="number" step="0.01" value={f.cost} onChange={e=>setF({...f,cost:e.target.value})}/></div>
      </div>
      <div style={{marginBottom:20}}><Lbl>Low stock threshold ({um})</Lbl><Inp type="number" value={f.low_threshold} onChange={e=>setF({...f,low_threshold:e.target.value})}/><div style={{color:C.dim,fontSize:11,marginTop:6}}>Shows LOW badge when stock drops below this.</div></div>
      {err&&<div style={{color:C.red,fontSize:12,marginBottom:12}}>{err}</div>}
      <button onClick={submit} disabled={busy} style={{width:"100%",background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:9,padding:"12px",fontWeight:700,fontSize:15,cursor:busy?"default":"pointer"}}>{busy?"Saving…":mat?"Save changes":"Add material"}</button>
    </Modal>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV IMPORT MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function CSVModal({materials,orgId,onClose,onDone,showToast}){
  const C=useT();
  const [txt,setTxt]=useState("");const [preview,setPreview]=useState(null);const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const fileRef=useRef();

  function readFile(f){
    const lower=f.name.toLowerCase();
    const isExcel=/\.(xlsx|xls|xlsm)$/.test(lower);
    const rd=new FileReader();
    if(isExcel){rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});const csv=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);setTxt(csv);setPreview(null);setErr("");}catch(_){setErr("Couldn't read that file. Try saving as CSV.");}};rd.readAsArrayBuffer(f);}
    else{rd.onload=()=>{setTxt(rd.result);setPreview(null);setErr("");};rd.readAsText(f);}
  }

  function buildPreview(){setErr("");const rows=rowsFromGrid(parseGrid(txt));if(!rows.length){setErr("No valid rows found. Make sure the first row has headers (Name, Quantity…).");return;}setPreview(rows);}

  async function apply(){
    if(!preview)return;setBusy(true);
    try{
      for(const r of preview){
        const match=materials.find(m=>m.name.toLowerCase()===r.name.toLowerCase()||(r.sku&&m.sku.toLowerCase()===r.sku.toLowerCase()));
        if(match){await sb.from("materials").update({stock:match.stock+r.qty}).eq("id",match.id);}
        else{
          let base=(r.sku||r.name.replace(/[^A-Za-z0-9]/g,"").slice(0,6)||"SKU").toUpperCase();let nid=base,k=2;while(materials.find(m=>m.sku===nid)){nid=base+k;k++;}
          await sb.from("materials").insert({org_id:orgId,sku:nid,name:r.name,stock:r.qty,cost:r.cost||0,unit:"sqft",low_threshold:DEFAULT_TH});
        }
      }
      showToast("Imported "+preview.length+" materials");await onDone();onClose();
    }catch(e){setErr(e.message);}setBusy(false);
  }

  const newCount=preview?preview.filter(r=>!materials.find(m=>m.name.toLowerCase()===r.name.toLowerCase())).length:0;
  const updCount=(preview?preview.length:0)-newCount;

  return(
    <Modal title="Import materials from spreadsheet" onClose={onClose}>
      <div style={{color:C.muted,fontSize:13,marginBottom:14,lineHeight:1.6}}>Upload a CSV or Excel file, or paste copied cells. First row must be headers:<div style={{marginTop:6,background:C.surface,border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",fontFamily:"monospace",fontSize:12,color:C.text}}>Name, SKU, Quantity, Category, Supplier, Cost</div></div>
      <input type="file" ref={fileRef} style={{display:"none"}} onChange={e=>{if(e.target.files[0])readFile(e.target.files[0]);e.target.value="";}}/>
      <button onClick={()=>fileRef.current&&fileRef.current.click()} style={{background:C.orange,border:"none",color:"#fff",borderRadius:9,padding:"10px 18px",fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:12}}>Choose file (CSV or Excel)</button>
      <textarea value={txt} onChange={e=>{setTxt(e.target.value);setPreview(null);setErr("");}} rows={4} placeholder={"Name\tCategory\tQty\nTravertine Silver\tTravertine\t640\n\nOr paste copied cells from Numbers here"} style={{width:"100%",background:C.surface,border:"1.5px solid "+C.border,borderRadius:9,padding:11,fontSize:12,color:C.text,fontFamily:"monospace",resize:"vertical",outline:"none",display:"block",marginBottom:10}}/>
      {err&&<div style={{color:C.red,fontSize:12,marginBottom:10}}>{err}</div>}
      {!preview&&txt.trim()&&<button onClick={buildPreview} style={{background:"transparent",border:"1.5px solid "+C.border,color:C.text,borderRadius:8,padding:"9px 18px",fontWeight:700,fontSize:13,cursor:"pointer"}}>Preview</button>}
      {preview&&(
        <div style={{marginTop:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontWeight:700,fontSize:13}}><span style={{color:C.green}}>{newCount} new</span> · <span style={{color:C.orange}}>{updCount} update</span></span>
            <button onClick={apply} disabled={busy} style={{background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:busy?"default":"pointer"}}>{busy?"Importing…":"Apply import"}</button>
          </div>
          <div style={{maxHeight:220,overflowY:"auto",border:"1px solid "+C.border,borderRadius:8}}>
            {preview.map((r,i)=>{const exists=!!materials.find(m=>m.name.toLowerCase()===r.name.toLowerCase());return(
              <div key={i} style={{padding:"8px 12px",borderBottom:"1px solid "+C.border,fontSize:12,display:"flex",gap:10,alignItems:"center"}}>
                <span style={{flex:1}}>{r.name}</span>
                <span style={{color:C.muted}}>{r.qty}</span>
                <span style={{background:exists?C.yellowBg:C.greenBg,color:exists?C.yellow:C.green,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999}}>{exists?"Update":"New"}</span>
              </div>
            );})}
          </div>
        </div>
      )}
    </Modal>
  );
}

// PO SCANNER MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function POModal({materials,orgId,onClose,onDone,showToast}){
  const C=useT();
  const [scanning,setScanning]=useState(false);const [scanErr,setScanErr]=useState(null);const [scanStage,setScanStage]=useState("");
  const [photo,setPhoto]=useState(null);const [poTxt,setPoTxt]=useState("");const [pasteTxt,setPasteTxt]=useState("");
  const [preview,setPreview]=useState(null);const [matPrev,setMatPrev]=useState(null);const [matErr,setMatErr]=useState(null);
  const [poMeta,setPoMeta]=useState(null);const [busy,setBusy]=useState(false);
  const lastSig=useRef(""); const TIMEOUT=60000;

  async function scan(file){
    const sig=file.name+"|"+file.size;if(scanning){return;}if(sig===lastSig.current){showToast("Already scanned that file");return;}lastSig.current=sig;
    const isPdf=(file.type||"")==="application/pdf"||/\.pdf$/i.test(file.name);
    setScanErr(null);setPreview(null);setMatPrev(null);setMatErr(null);setPoMeta(null);setScanning(true);
    if(!isPdf)setPhoto(URL.createObjectURL(file));

    let b64;
    try{
      if(isPdf){setScanStage("Reading PDF…");b64=await toB64(file);}
      else{setScanStage("Optimizing image…");const blob=await prepImg(file);b64=await toB64(blob);}
    }catch(e){setScanErr("Couldn't read the file.");setScanning(false);return;}

    const skus=materials.length?materials.map(m=>m.sku+" = "+m.name+" ["+( m.category||"")+"]").join("\n"):"(catalog is empty)";
    const prompt="You are reading a purchase order for a stone/tile/countertop fabrication company. The scan may be crooked, shadowed, or multi-page. Extract every line item.\n\nMaterial catalog:\n"+skus+"\n\nRules:\n- Find every line item across all pages.\n- Match items to catalog SKUs when the description clearly corresponds; else matched_sku=null.\n- qty = ordered quantity as a number (strip sf/sqft/pcs). If ambiguous, best estimate + qty_confidence=low.\n- Do NOT return tax/shipping rows as items.\n\nReturn ONLY valid minified JSON, no prose, no code fences:\n{\"po_number\":null,\"vendor\":null,\"order_date\":null,\"totals\":{\"total\":null},\"items\":[{\"raw_line\":\"\",\"matched_sku\":null,\"suggested_name\":\"\",\"qty\":0,\"unit_cost\":null,\"qty_confidence\":\"high\"}]}";

    setScanStage(isPdf?"Scanning PDF…":"Scanning document…");
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),TIMEOUT);
    let resp;
    try{resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:[isPdf?{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}:{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}]})});}
    catch(e){clearTimeout(timer);setScanErr(e.name==="AbortError"?"Timed out after 60s. Try a smaller or clearer file.":"Network error. Scanning requires an internet connection.");setScanning(false);return;}
    clearTimeout(timer);

    if(!resp.ok){setScanErr("Scanner error ("+resp.status+").");setScanning(false);return;}
    const data=await resp.json();
    const tb=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(!tb){setScanErr("No response from scanner.");setScanning(false);return;}

    try{
      const m=tb.match(/\{[\s\S]*\}/);const parsed=JSON.parse((m?m[0]:tb).replace(/```json|```/g,"").trim());
      const items=(parsed.items||[]).map(it=>{
        const qty=toNum(it.qty);if(!qty||qty<=0)return null;
        const nm=String(it.suggested_name||it.raw_line||"").trim();
        const skuKey=it.matched_sku?it.matched_sku.toUpperCase():null;
        const match=(skuKey&&materials.find(m=>m.sku.toUpperCase()===skuKey))||(nm&&materials.find(m=>m.name.toLowerCase()===nm.toLowerCase()));
        return{name:match?match.name:(nm||"Unknown"),qty,sku:match?match.sku:skuKey,unitCost:toNum(it.unit_cost),lowConf:it.qty_confidence==="low",isNew:!match};
      }).filter(Boolean);
      if(!items.length){setScanErr("No valid line items found. Try a clearer scan.");setScanning(false);return;}
      setPoMeta({po:parsed.po_number||null,vendor:parsed.vendor||null,date:parsed.order_date||null,total:toNum(parsed.totals&&parsed.totals.total)});
      setPreview(items);setScanStage("");showToast("Scanned "+items.length+" item"+(items.length!==1?"s":""));
    }catch(e){setScanErr("Couldn't parse scan results.");}
    setScanning(false);
  }

  function prepImg(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const MAX=1600;let w=img.width,h=img.height;if(w>MAX||h>MAX){if(w>h){h=Math.round(h*(MAX/w));w=MAX;}else{w=Math.round(w*(MAX/h));h=MAX;}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>{if(!b)rej(new Error("fail"));else res(b);},"image/jpeg",0.85);};img.onerror=()=>rej(new Error("bad"));img.src=url;});}
  function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("read"));r.readAsDataURL(file);})}

  function parseTxt(txt){return txt.trim().split("\n").filter(Boolean).map(line=>{const m=line.match(/^(.*?)[,\t]+(\d+(?:\.\d+)?)\s*$/);if(!m)return null;const label=m[1].trim(),qty=parseFloat(m[2]);if(!label||!isFinite(qty)||qty<=0)return null;const match=materials.find(m=>m.sku.toLowerCase()===label.toLowerCase()||m.name.toLowerCase()===label.toLowerCase());return{name:match?match.name:label,qty,sku:match?match.sku:null,unitCost:null,lowConf:false,isNew:!match};}).filter(Boolean);}

  function applyPaste(){const rows=rowsFromGrid(parseGrid(pasteTxt));if(!rows.length){setMatErr("No valid rows found.");return;}setMatPrev(rows.map(r=>{const match=materials.find(m=>m.name.toLowerCase()===r.name.toLowerCase());return{name:match?match.name:r.name,qty:r.qty,sku:match?match.sku:null,unitCost:r.cost||null,lowConf:false,isNew:!match};}));setMatErr(null);setPreview(null);}

  async function applyItems(items){
    setBusy(true);
    try{
      for(const it of items){
        const match=materials.find(m=>(it.sku&&m.sku===it.sku)||m.name.toLowerCase()===it.name.toLowerCase());
        if(match){await sb.from("materials").update({stock:match.stock+it.qty}).eq("id",match.id);}
        else{let base=(it.name.replace(/[^A-Za-z0-9]/g,"").slice(0,6)||"SKU").toUpperCase();let nid=base,k=2;while(materials.find(m=>m.sku===nid)){nid=base+k;k++;}await sb.from("materials").insert({org_id:orgId,sku:nid,name:it.name,stock:it.qty,cost:it.unitCost||0,unit:"sqft",low_threshold:DEFAULT_TH,supplier:(poMeta&&poMeta.vendor)||null});}
      }
      showToast("Added to inventory");await onDone();onClose();
    }catch(e){setScanErr(e.message);}setBusy(false);
  }

  const ItemList=({items})=>(
    <div style={{maxHeight:220,overflowY:"auto",border:"1px solid "+C.border,borderRadius:8}}>
      {items.map((it,i)=>(
        <div key={i} style={{padding:"9px 12px",borderBottom:"1px solid "+C.border,fontSize:12,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{flex:1}}>{it.name}{it.lowConf&&<span style={{marginLeft:8,background:C.yellowBg,color:C.yellow,fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:999}}>check qty</span>}</span>
          <span style={{color:C.muted}}>{it.qty}</span>
          <span style={{background:it.isNew?C.greenBg:C.yellowBg,color:it.isNew?C.green:C.yellow,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999}}>{it.isNew?"New":"Update"}</span>
        </div>
      ))}
    </div>
  );

  return(
    <Modal title="Import Purchase Order" onClose={onClose}>
      {/* Camera / upload */}
      <div style={{marginBottom:18}}>
        <Lbl>Scan a photo or PDF</Lbl>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <label style={{flex:1,background:scanning?C.surface:C.orange,color:scanning?C.dim:"#fff",borderRadius:9,padding:"12px",fontWeight:700,fontSize:14,cursor:scanning?"default":"pointer",textAlign:"center",display:"block"}}>
            Take Photo
            <input type="file" accept="image/*" capture="environment" disabled={scanning} style={{display:"none"}} onChange={e=>{if(e.target.files[0])scan(e.target.files[0]);e.target.value="";}}/>
          </label>
          <label style={{flex:1,background:"transparent",border:"1.5px solid "+C.border,color:C.text,borderRadius:9,padding:"12px",fontWeight:700,fontSize:14,cursor:scanning?"default":"pointer",textAlign:"center",display:"block",opacity:scanning?0.6:1}}>
            Upload File
            <input type="file" disabled={scanning} style={{display:"none"}} onChange={e=>{if(e.target.files[0])scan(e.target.files[0]);e.target.value="";}}/>
          </label>
        </div>
        <div style={{color:C.dim,fontSize:11,marginBottom:8}}>Photo or PDF of a vendor PO. AI extracts line items automatically.</div>
        {(photo||scanning)&&(
          <div style={{display:"flex",gap:10,alignItems:"center",background:C.surface,border:"1px solid "+C.border,borderRadius:9,padding:10,marginBottom:8}}>
            {photo?<img src={photo} style={{width:52,height:52,objectFit:"cover",borderRadius:6}} alt="PO"/>:<div style={{width:52,height:52,borderRadius:6,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:C.muted,fontWeight:700}}>PDF</div>}
            <div style={{flex:1,fontSize:13,color:scanning?C.muted:scanErr?C.red:C.green,fontWeight:600}}>{scanning?(scanStage||"Scanning…"):scanErr||"Scan complete"}</div>
            {scanning&&<span style={{width:16,height:16,border:"2px solid "+C.border,borderTop:"2px solid "+C.orange,borderRadius:"50%",display:"inline-block",animation:"spin 0.8s linear infinite"}}/>}
          </div>
        )}
        {scanErr&&!photo&&<div style={{color:C.red,fontSize:12,marginBottom:8}}>{scanErr}</div>}
        {poMeta&&(poMeta.vendor||poMeta.po||poMeta.date||poMeta.total!=null)&&(
          <div style={{background:C.bg,border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",marginBottom:8,fontSize:12,color:C.muted,display:"flex",gap:14,flexWrap:"wrap"}}>
            {poMeta.vendor&&<span><b style={{color:C.text}}>Vendor:</b> {poMeta.vendor}</span>}
            {poMeta.po&&<span><b style={{color:C.text}}>PO #:</b> {poMeta.po}</span>}
            {poMeta.date&&<span><b style={{color:C.text}}>Date:</b> {poMeta.date}</span>}
            {poMeta.total!=null&&<span><b style={{color:C.text}}>Total:</b> ${poMeta.total}</span>}
          </div>
        )}
        {preview&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:13}}>{preview.length} item{preview.length!==1?"s":""}</span>
              <button onClick={()=>applyItems(preview)} disabled={busy} style={{background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:busy?"default":"pointer"}}>{busy?"Adding…":"Add to Materials"}</button>
            </div>
            <ItemList items={preview}/>
          </div>
        )}
      </div>

      {/* Paste from spreadsheet */}
      <div style={{borderTop:"1px solid "+C.border,paddingTop:16,marginBottom:16}}>
        <Lbl>Paste from Numbers / Excel</Lbl>
        <div style={{color:C.muted,fontSize:12,marginBottom:8}}>Copy cells (with header row) and paste here.</div>
        <textarea value={pasteTxt} onChange={e=>{setPasteTxt(e.target.value);setMatPrev(null);setMatErr(null);}} rows={3} placeholder={"Name\tCategory\tQty\nTravertine Silver\tTravertine\t640"} style={{width:"100%",background:C.surface,border:"1.5px solid "+C.border,borderRadius:9,padding:11,fontSize:12,color:C.text,fontFamily:"monospace",resize:"vertical",outline:"none",display:"block",marginBottom:8}}/>
        <button onClick={applyPaste} disabled={!pasteTxt.trim()} style={{background:pasteTxt.trim()?C.surface:C.surface,border:"1px solid "+C.border,color:C.text,borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:"pointer"}}>Preview paste</button>
        {matErr&&<div style={{color:C.red,fontSize:12,marginTop:8}}>{matErr}</div>}
        {matPrev&&(
          <div style={{marginTop:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:13}}>{matPrev.length} material{matPrev.length!==1?"s":""}</span>
              <button onClick={()=>applyItems(matPrev)} disabled={busy} style={{background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:busy?"default":"pointer"}}>{busy?"Adding…":"Add to Materials"}</button>
            </div>
            <ItemList items={matPrev}/>
          </div>
        )}
      </div>

      {/* Manual entry */}
      <div style={{borderTop:"1px solid "+C.border,paddingTop:16}}>
        <Lbl>Type manually</Lbl>
        <div style={{color:C.muted,fontSize:12,marginBottom:8}}>Name or SKU, then quantity — one per line.</div>
        <textarea value={poTxt} onChange={e=>setPoTxt(e.target.value)} rows={3} placeholder={"Travertine Silver, 200\nCream Marble, 120"} style={{width:"100%",background:C.surface,border:"1.5px solid "+C.border,borderRadius:9,padding:11,fontSize:13,color:C.text,fontFamily:"monospace",resize:"vertical",outline:"none",display:"block",marginBottom:8}}/>
        <button onClick={()=>{const items=parseTxt(poTxt);if(!items.length)return;setPreview(items);setMatPrev(null);}} disabled={!poTxt.trim()} style={{background:"transparent",border:"1px solid "+C.border,color:C.text,borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:"pointer"}}>Preview</button>
      </div>
    </Modal>
  );
}

// JOB MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function JobModal({job,profiles,orgId,onClose,onDone,showToast}){
  const C=useT();
  const [f,setF]=useState(job?{name:job.name,details:job.details||"",status:job.status,job_date:job.job_date||"",job_time:job.job_time||"9:00 AM",assigned_to:job.assigned_to||"",location:job.location||"Charleston"}:{name:"",details:"",status:"Scheduled",job_date:"",job_time:"9:00 AM",assigned_to:"",location:"Charleston"});
  const [busy,setBusy]=useState(false);const [err,setErr]=useState("");

  async function submit(){
    setErr("");if(!f.name.trim()||!f.job_date){setErr("Name and date are required.");return;}
    setBusy(true);
    try{
      const payload={name:f.name.trim(),details:f.details.trim()||null,status:f.status,job_date:f.job_date,job_time:f.job_time||null,assigned_to:f.assigned_to||null,location:f.location||"Charleston"};
      if(job){const {error}=await sb.from("jobs").update(payload).eq("id",job.id);if(error)throw error;showToast("Job updated");}
      else{const {error}=await sb.from("jobs").insert({...payload,org_id:orgId});if(error)throw error;showToast("Job created");}
      await onDone();onClose();
    }catch(e){setErr(e.message);}setBusy(false);
  }

  return(
    <Modal title={job?"Edit job":"New job"} onClose={onClose}>
      <div style={{marginBottom:14}}><Lbl>Job name</Lbl><Inp value={f.name} placeholder="Marriott Lobby Phase 2" onChange={e=>setF({...f,name:e.target.value})}/></div>
      <div style={{marginBottom:14}}><Lbl>Details / client</Lbl><textarea value={f.details} placeholder="Client name, scope, notes…" onChange={e=>setF({...f,details:e.target.value})} rows={3} style={{width:"100%",background:C.surface,border:"1.5px solid "+C.border,borderRadius:8,padding:"10px 14px",fontSize:14,color:C.text,outline:"none",resize:"vertical",fontFamily:"inherit"}}/></div>
      <div style={{marginBottom:14}}><Lbl>Location</Lbl>
        <div style={{display:"flex",gap:8}}>
          {LOCATIONS.map(l=>(
            <button key={l} onClick={()=>setF({...f,location:l})} style={{flex:1,padding:"9px",borderRadius:8,cursor:"pointer",border:"1.5px solid "+(f.location===l?"var(--C-orange, #d4642a)":"var(--C-border, #38382f)"),background:f.location===l?"var(--C-surface, #232320)":"transparent",color:f.location===l?"#d4642a":"#8a8880",fontWeight:700,fontSize:13}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:14}}><Lbl>Assigned to</Lbl><Sel value={f.assigned_to} onChange={e=>setF({...f,assigned_to:e.target.value})}><option value="">— Unassigned —</option>{profiles.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}</Sel></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <div><Lbl>Date</Lbl><Inp type="date" value={f.job_date} onChange={e=>setF({...f,job_date:e.target.value})}/></div>
        <div><Lbl>Time</Lbl><Inp value={f.job_time} placeholder="9:00 AM" onChange={e=>setF({...f,job_time:e.target.value})}/></div>
      </div>
      <div style={{marginBottom:20}}><Lbl>Status</Lbl><Sel value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{STATUSES.map(s=><option key={s}>{s}</option>)}</Sel></div>
      {err&&<div style={{color:C.red,fontSize:12,marginBottom:12}}>{err}</div>}
      <button onClick={submit} disabled={busy} style={{width:"100%",background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:9,padding:"12px",fontWeight:700,fontSize:15,cursor:busy?"default":"pointer"}}>{busy?"Saving…":job?"Save changes":"Create job"}</button>
    </Modal>
  );
}

// BULK EDIT MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function BulkEditModal({ids,cats,onClose,onDone,showToast}){
  const C=useT();
  const OL={none:"No change",set:"Set to",add:"Add",subtract:"Subtract",percent:"Adjust by %"};
  const apOp=(cur,op,val)=>{const n=parseFloat(val);if(isNaN(n))return cur;if(op==="set")return n;if(op==="add")return cur+n;if(op==="subtract")return Math.max(0,cur-n);if(op==="percent")return Math.max(0,cur*(1+n/100));return cur;};
  const [cat,setCat]=useState("");const [unit,setUnit]=useState("");const [supplier,setSupplier]=useState("");const [lt,setLt]=useState("");
  const [sOp,setSop]=useState("none");const [sVal,setSval]=useState("");
  const [cOp,setCop]=useState("none");const [cVal,setCval]=useState("");
  const [busy,setBusy]=useState(false);

  async function apply(){
    setBusy(true);
    try{
      const patch={};
      if(cat)patch.category=cat;if(unit)patch.unit=unit;if(supplier.trim())patch.supplier=supplier.trim();if(lt!=="")patch.low_threshold=parseFloat(lt)||0;
      if(Object.keys(patch).length)await sb.from("materials").update(patch).in("id",ids);
      if((sOp!=="none"&&sVal!=="")&&(cOp!=="none"&&cVal!=="")){
        const {data}=await sb.from("materials").select("id,stock,cost").in("id",ids);
        for(const m of data||[]){await sb.from("materials").update({stock:Math.round(apOp(m.stock,sOp,sVal)*100)/100,cost:Math.round(apOp(m.cost,cOp,cVal)*100)/100}).eq("id",m.id);}
      } else if(sOp!=="none"&&sVal!==""){
        const {data}=await sb.from("materials").select("id,stock").in("id",ids);
        for(const m of data||[])await sb.from("materials").update({stock:Math.round(apOp(m.stock,sOp,sVal)*100)/100}).eq("id",m.id);
      } else if(cOp!=="none"&&cVal!==""){
        const {data}=await sb.from("materials").select("id,cost").in("id",ids);
        for(const m of data||[])await sb.from("materials").update({cost:Math.round(apOp(m.cost,cOp,cVal)*100)/100}).eq("id",m.id);
      }
      showToast("Updated "+ids.length+" material"+(ids.length>1?"s":""));await onDone();onClose();
    }catch(e){console.error(e);}setBusy(false);
  }

  return(
    <Modal title={"Edit "+ids.length+" material"+(ids.length>1?"s":"")} onClose={onClose}>
      <div style={{color:C.muted,fontSize:12,marginBottom:16}}>Only the fields you change are applied.</div>
      <div style={{marginBottom:14}}><Lbl>Category</Lbl><Sel value={cat} onChange={e=>setCat(e.target.value)}><option value="">— No change —</option>{cats.map(c=><option key={c}>{c}</option>)}</Sel></div>
      <div style={{marginBottom:14}}><Lbl>How it's counted</Lbl><Sel value={unit} onChange={e=>setUnit(e.target.value)}><option value="">— No change —</option><option value="sqft">Square Feet</option><option value="units">Units (count)</option></Sel></div>
      <div style={{marginBottom:14}}><Lbl>Supplier</Lbl><Inp value={supplier} placeholder="Leave blank for no change" onChange={e=>setSupplier(e.target.value)}/></div>
      <div style={{marginBottom:14}}><Lbl>Low stock threshold</Lbl><Inp type="number" value={lt} placeholder="Leave blank for no change" onChange={e=>setLt(e.target.value)}/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        <div><Lbl>Stock</Lbl><Sel value={sOp} onChange={e=>setSop(e.target.value)} style={{marginBottom:8}}>{Object.entries(OL).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Sel>{sOp!=="none"&&<Inp type="number" value={sVal} placeholder={sOp==="percent"?"e.g. 10 or -10":"amount"} onChange={e=>setSval(e.target.value)}/>}</div>
        <div><Lbl>Cost</Lbl><Sel value={cOp} onChange={e=>setCop(e.target.value)} style={{marginBottom:8}}>{Object.entries(OL).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Sel>{cOp!=="none"&&<Inp type="number" step="0.01" value={cVal} placeholder={cOp==="percent"?"e.g. 10 or -10":"$"} onChange={e=>setCval(e.target.value)}/>}</div>
      </div>
      <button onClick={apply} disabled={busy} style={{width:"100%",background:busy?C.surface:C.orange,border:"none",color:busy?C.dim:"#fff",borderRadius:9,padding:"12px",fontWeight:700,fontSize:15,cursor:busy?"default":"pointer"}}>{busy?"Applying…":"Apply to "+ids.length}</button>
    </Modal>
  );
}

// ADMIN PANEL
// ═══════════════════════════════════════════════════════════════════════════════
function AdminPanel({profile,cats,materials,jobs,reload,showToast}){
  const C=useT();
  const [team,setTeam]=useState([]);const [log,setLog]=useState([]);
  const [matTrash,setMatTrash]=useState([]);const [jobTrash,setJobTrash]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    if(!profile)return;
    (async()=>{
      const [t,l,mt,jt]=await Promise.all([
        sb.from("profiles").select("*").eq("org_id",profile.org_id),
        sb.from("activity_log").select("*,profiles(full_name)").eq("org_id",profile.org_id).order("created_at",{ascending:false}).limit(50),
        sb.from("materials").select("*").eq("org_id",profile.org_id).not("deleted_at","is",null),
        sb.from("jobs").select("*").eq("org_id",profile.org_id).not("deleted_at","is",null),
      ]);
      setTeam(t.data||[]);setLog(l.data||[]);setMatTrash(mt.data||[]);setJobTrash(jt.data||[]);setLoading(false);
    })();
  },[profile]);

  async function changeRole(id,role){await sb.from("profiles").update({role}).eq("id",id);setTeam(team.map(p=>p.id===id?{...p,role}:p));showToast("Role updated");}
  async function restoreMat(m){await sb.from("materials").update({deleted_at:null}).eq("id",m.id);setMatTrash(matTrash.filter(x=>x.id!==m.id));showToast("Material restored");reload();}
  async function deleteMatForever(id){await sb.from("materials").delete().eq("id",id);setMatTrash(matTrash.filter(x=>x.id!==id));showToast("Deleted permanently");}
  async function restoreJob(j){await sb.from("jobs").update({deleted_at:null}).eq("id",j.id);setJobTrash(jobTrash.filter(x=>x.id!==j.id));showToast("Job restored");reload();}
  async function deleteJobForever(id){await sb.from("jobs").delete().eq("id",id);setJobTrash(jobTrash.filter(x=>x.id!==id));showToast("Deleted permanently");}

  const Box=({children})=><div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:18,marginBottom:14}}>{children}</div>;
  const Ttl=({t})=><div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{t}</div>;
  const Sub=({t})=><div style={{color:C.muted,fontSize:12,marginBottom:12,lineHeight:1.5}}>{t}</div>;

  if(loading)return <div style={{textAlign:"center",marginTop:40,color:C.muted}}>Loading…</div>;

  return(
    <div style={{maxWidth:640}}>
      <Box>
        <Ttl t="Company join code"/>
        <Sub t="Share this with new team members so they can join."/>
        <code style={{background:C.surface,border:"1px solid "+C.border,borderRadius:8,padding:"10px 14px",display:"block",fontSize:13,letterSpacing:"0.05em",wordBreak:"break-all",color:C.text}}>{profile.org_id}</code>
      </Box>

      <Box>
        <Ttl t={"Team ("+team.length+")"}/>
        <Sub t="Operations Manager, Estimator, and Project Manager can access Admin."/>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {team.map(p=>(
            <div key={p.id} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:9,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:1,fontWeight:700,fontSize:13}}>{p.full_name}{p.id===profile.id&&<span style={{marginLeft:8,fontSize:10,color:C.muted,fontWeight:400}}>(you)</span>}</div>
              <Sel value={p.role} onChange={e=>changeRole(p.id,e.target.value)} style={{width:"auto",minWidth:200,padding:"6px 10px",fontSize:12}} disabled={p.id===profile.id}>
                {ROLES.map(r=><option key={r} value={r}>{RLBL[r]}</option>)}
              </Sel>
            </div>
          ))}
        </div>
      </Box>

      <Box>
        <Ttl t={"Material trash ("+matTrash.length+")"}/>
        <Sub t="Deleted materials land here."/>
        {matTrash.length===0?<div style={{color:C.dim,fontSize:13,textAlign:"center",padding:"12px 0"}}>Empty</div>:matTrash.map(m=>(
          <div key={m.id} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:9,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
            <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{m.name} <span style={{fontFamily:"monospace",color:C.orange,fontSize:11}}>{m.sku}</span></div><div style={{color:C.muted,fontSize:11}}>{m.category} · {m.stock} · {ago(m.deleted_at)}</div></div>
            <button onClick={()=>restoreMat(m)} style={{background:C.greenBg,color:C.green,border:"1px solid "+C.green,borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Restore</button>
            <button onClick={()=>deleteMatForever(m.id)} style={{background:C.redBg,color:C.red,border:"1px solid "+C.red,borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Delete forever</button>
          </div>
        ))}
      </Box>

      <Box>
        <Ttl t={"Job trash ("+jobTrash.length+")"}/>
        <Sub t="Deleted jobs land here."/>
        {jobTrash.length===0?<div style={{color:C.dim,fontSize:13,textAlign:"center",padding:"12px 0"}}>Empty</div>:jobTrash.map(j=>(
          <div key={j.id} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:9,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
            <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{j.name}</div><div style={{color:C.muted,fontSize:11}}>{j.details} · {ago(j.deleted_at)}</div></div>
            <button onClick={()=>restoreJob(j)} style={{background:C.greenBg,color:C.green,border:"1px solid "+C.green,borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Restore</button>
            <button onClick={()=>deleteJobForever(j.id)} style={{background:C.redBg,color:C.red,border:"1px solid "+C.red,borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Delete forever</button>
          </div>
        ))}
      </Box>

      <Box>
        <Ttl t="Activity log"/>
        <Sub t="Recent changes across the whole team."/>
        {log.length===0?<div style={{color:C.dim,fontSize:13,textAlign:"center",padding:"12px 0"}}>No activity yet.</div>:(
          <div style={{maxHeight:280,overflowY:"auto"}}>
            {log.map(e=>(
              <div key={e.id} style={{padding:"8px 0",borderBottom:"1px solid "+C.border,fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10}}><span style={{fontWeight:700}}>{e.action}</span><span style={{color:C.dim,fontSize:11}}>{ago(e.created_at)}</span></div>
                <div style={{color:C.muted,marginTop:2}}>{e.profiles?.full_name} · {e.detail}</div>
              </div>
            ))}
          </div>
        )}
      </Box>
    </div>
  );
}

// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
function AppInner({session,profile,onSignOut}){
  const C=useT();
  const [tab,setTab]=useState("schedule");
  const [theme,setTheme]=useState("dark");
  const [unit,setUnit]=useState("sqft");
  const [sync,setSync]=useState("saved");
  const [toast,setToast]=useState(null);

  // Data
  const [materials,setMaterials]=useState([]);
  const [cats,setCats]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [jobMats,setJobMats]=useState([]);
  const [profiles,setProfiles]=useState([]);

  // UI state
  const [sfilt,setSfilt]=useState("All");
  const [lfilt,setLfilt]=useState("All");
  const [cfilt,setCfilt]=useState("All");
  const [fabStatFilt,setFabStatFilt]=useState("All");
  const [isrch,setIsrch]=useState("");
  const [expJob,setExpJob]=useState(null);
  const [modal,setModal]=useState(null);
  const [mdata,setMdata]=useState(null);
  const [selMode,setSelMode]=useState(false);
  const [selIds,setSelIds]=useState([]);

  const orgId=profile.org_id;
  const showAdmin=ADMIN_R.includes(profile.role);
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2800);};
  const openModal=(n,d)=>{setModal(n);setMdata(d||null);};
  const closeModal=()=>{setModal(null);setMdata(null);};
  const gu=unit==="sqm"?"sqm":"sqft";

  async function reload(){
    setSync("saving");
    try{
      const [m,c,j,jm,p]=await Promise.all([
        sb.from("materials").select("*").eq("org_id",orgId).is("deleted_at",null),
        sb.from("categories").select("name").eq("org_id",orgId).order("name"),
        sb.from("jobs").select("*").eq("org_id",orgId).is("deleted_at",null),
        sb.from("job_materials").select("*"),
        sb.from("profiles").select("*").eq("org_id",orgId),
      ]);
      setMaterials(byName(m.data||[]));setCats((c.data||[]).map(x=>x.name));
      setJobs(j.data||[]);setJobMats(jm.data||[]);setProfiles(p.data||[]);
      setSync("saved");
    }catch(e){setSync("error");console.error(e);}
  }

  useEffect(()=>{reload();},[orgId]);
  useEffect(()=>{const t=setInterval(reload,8000);return()=>clearInterval(t);},[orgId]);

  async function logAct(action,detail){
    await sb.from("activity_log").insert({org_id:orgId,user_id:profile.id,action,detail:detail||null});
  }

  // ── Materials helpers ────────────────────────────────────────────────────────
  const finv=materials.filter(m=>(cfilt==="All"||m.category===cfilt)&&(!isrch||m.name.toLowerCase().includes(isrch.toLowerCase())||m.sku.toLowerCase().includes(isrch.toLowerCase())));
  function toggleSel(id){setSelIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);}
  function exitSel(){setSelMode(false);setSelIds([]);}
  async function bulkDelete(){
    await sb.from("materials").update({deleted_at:new Date().toISOString()}).in("id",selIds);
    showToast("Moved "+selIds.length+" to trash");logAct("Materials deleted",selIds.length+" items");exitSel();reload();
  }

  async function saveExportCSV(){
    const cols=["SKU","Material","Category","Supplier","Stock ("+gu+")","Cost per "+gu,"Total Value","Low Threshold","Status"];
    const esc=v=>{const s=v==null?"":String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const rows=materials.map(m=>{const st=m.stock===0?"Out of stock":isLow(m)?"Low":"OK";return[m.sku,m.name,m.category||"",m.supplier||"",m.stock,m.cost.toFixed(2),(m.stock*m.cost).toFixed(2),m.low_threshold,st].map(esc).join(",");});
    const csv="\uFEFF"+[cols.map(esc).join(","),...rows].join("\r\n");
    const fn="superior-stone-materials-"+new Date().toISOString().slice(0,10)+".csv";
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    try{if(navigator.canShare){const file=new File([blob],fn,{type:"text/csv"});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});showToast("Tap 'Save to Files' to keep it");return;}}}catch(e){if(e.name==="AbortError")return;}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),2000);showToast("Saved to Downloads ("+materials.length+" items)");
  }

  // ── Schedule helpers ─────────────────────────────────────────────────────────
  const sLbl=(stock,req)=>{if(stock===0)return{label:"Out of stock",bg:C.redBg,color:C.red};if(stock<req)return{label:"Short "+(req-stock),bg:C.redBg,color:C.red};if(stock<req*1.15)return{label:"Low buffer",bg:C.yellowBg,color:C.yellow};return{label:"Sufficient",bg:C.greenBg,color:C.green};};
  const fjobs=jobs.filter(j=>j.status!=="Complete"&&(sfilt==="All"||j.status===sfilt)&&(lfilt==="All"||j.location===lfilt));
  const grpd=fjobs.reduce((acc,j)=>{(acc[j.job_date||""]= acc[j.job_date||""]||[]).push(j);return acc;},{});
  function matsForJob(jobId){return jobMats.filter(jm=>jm.job_id===jobId).map(jm=>{const mat=materials.find(m=>m.id===jm.material_id);return{...jm,mat,name:mat?mat.name:jm.material_id,stock:mat?mat.stock:0};});}

  // ── Alerts ───────────────────────────────────────────────────────────────────
  const alertCnt=materials.filter(m=>m.stock===0).length+materials.filter(m=>isLow(m)).length+
    jobs.flatMap(j=>matsForJob(j.id).filter(m=>m.stock<m.required)).length;

  // ── Settings modal ───────────────────────────────────────────────────────────
  const SettingsModal=()=>(
    <Modal title="Settings" onClose={closeModal}>
      <div style={{marginBottom:22}}><Lbl>Appearance</Lbl>
        <div style={{display:"flex",gap:10}}>
          {["dark","light"].map(m=>(
            <button key={m} onClick={()=>setTheme(m)} style={{flex:1,padding:"16px 12px",borderRadius:12,cursor:"pointer",border:theme===m?"2px solid "+C.orange:"1.5px solid "+C.border,background:theme===m?(m==="dark"?"#1a1a17":"#faf8f5"):C.surface,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <span style={{fontSize:22}}>{m==="dark"?"🌙":"☀️"}</span>
              <span style={{fontSize:13,fontWeight:700,color:theme===m?C.orange:C.text,textTransform:"capitalize"}}>{m}</span>
            </button>
          ))}
        </div>
      </div>
      <div><Lbl>Units</Lbl>
        <div style={{display:"flex",gap:10}}>
          {["sqft","sqm"].map(u=>(
            <button key={u} onClick={()=>setUnit(u)} style={{flex:1,padding:"10px",borderRadius:9,cursor:"pointer",border:unit===u?"2px solid "+C.orange:"1.5px solid "+C.border,background:unit===u?C.surface:"transparent",color:unit===u?C.orange:C.muted,fontWeight:700,fontSize:13}}>
              {u==="sqft"?"Square Feet":"Square Meters"}
            </button>
          ))}
        </div>
      </div>
    </Modal>
  );

  const C2=theme==="light"?LIGHT:DARK;
  // Use C2 as local C for this render since theme might differ
  const TC=C2;

  const tabs=[ ["schedule","Schedule"],["materials","Materials"],["alerts","Alerts"+(alertCnt?" ("+alertCnt+")":"")],["fab","Fabrication"],...(showAdmin?[["admin","Admin"]]:[])]

  return(
    <div style={{background:TC.bg,minHeight:"100vh",color:TC.text,paddingBottom:100}}>
      <style>{`::-webkit-scrollbar-track{background:${TC.bg}}::-webkit-scrollbar-thumb{background:${theme==="dark"?"#38382f":"#ddd6c9"};border-radius:3px}body{background:${TC.bg}}`}</style>
      <div style={{padding:"24px 24px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <span style={{fontSize:26}}>🟧</span>
          <div style={{flex:1}}><div style={{fontWeight:800,fontSize:22,letterSpacing:"-0.01em"}}>Superior Stone</div></div>
          <SyncDot state={sync}/>
          <span style={{fontSize:12,color:TC.muted,fontWeight:600}}>{profile.full_name}</span>
          <button onClick={onSignOut} style={{background:TC.surface,border:"1.5px solid "+TC.border,color:TC.muted,borderRadius:9,padding:"6px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>Sign out</button>
          <button onClick={()=>openModal("settings")} style={{background:TC.surface,border:"1.5px solid "+TC.border,color:TC.text,borderRadius:9,width:36,height:36,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>⚙️</button>
        </div>
        <div style={{display:"flex",alignItems:"center",borderBottom:"1px solid "+TC.border,flexWrap:"wrap"}}>
          {tabs.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{background:"none",border:"none",color:tab===k?TC.text:TC.muted,fontWeight:tab===k?700:500,fontSize:14,padding:"10px 18px",cursor:"pointer",borderBottom:tab===k?"2px solid "+TC.orange:"2px solid transparent",marginBottom:-1}}>{l}</button>
          ))}
          <button onClick={()=>openModal("po")} style={{marginLeft:"auto",background:"transparent",border:"1.5px solid "+TC.orange,color:TC.orange,borderRadius:8,padding:"6px 16px",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:8}}>Import PO</button>
        </div>
      </div>

      {/* ── SCHEDULE ─────────────────────────────────────────────────────────── */}
      {tab==="schedule"&&(
        <div style={{padding:"16px 24px"}}>
          <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {["All",...STATUSES.filter(s=>s!=="Complete")].map(s=><Pill key={s} label={s} active={sfilt===s} onClick={()=>setSfilt(s)}/>)}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
            {["All",...LOCATIONS].map(l=>(
              <button key={l} onClick={()=>setLfilt(l)} style={{background:lfilt===l?TC.orange:"transparent",color:lfilt===l?"#fff":TC.muted,border:"1.5px solid "+(lfilt===l?TC.orange:TC.border),borderRadius:999,padding:"4px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{l==="All"?"All Locations":l}</button>
            ))}
          </div>
          {Object.keys(grpd).sort().map(date=>(
            <div key={date} style={{marginBottom:24}}>
              <div style={{color:TC.orange,fontWeight:700,fontSize:14,marginBottom:10}}>{date?fmtD(date):"No date set"}</div>
              {grpd[date].map(job=>{
                const mats=matsForJob(job.id);const hs=mats.some(m=>m.stock<m.required);const isOpen=expJob===job.id;
                const assignee=profiles.find(p=>p.id===job.assigned_to);
                return(
                  <div key={job.id} style={{background:TC.card,borderRadius:12,overflow:"hidden",border:"1px solid "+(hs?TC.red:TC.border),borderLeft:"3px solid "+(hs?TC.red:TC.orange),marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",padding:"14px 18px",cursor:"pointer"}} onClick={()=>setExpJob(isOpen?null:job.id)}>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:15}}>{job.name}</div>
                        <div style={{color:TC.muted,fontSize:12,marginTop:3,display:"flex",gap:14,flexWrap:"wrap"}}>
                          <span>{job.details}</span><span>{job.job_time}</span>
                          {job.location&&<span style={{background:job.location==="Charleston"?TC.greenBg:TC.yellowBg,color:job.location==="Charleston"?TC.green:TC.yellow,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999}}>{job.location}</span>}
                          {assignee?<span>Assigned: {assignee.full_name}</span>:<span style={{color:TC.dim}}>Unassigned</span>}
                          {hs&&<span style={{color:TC.red,fontWeight:700}}>Shortage</span>}
                        </div>
                      </div>
                      <span style={{fontSize:11,color:TC.muted,background:TC.surface,padding:"3px 9px",borderRadius:999,border:"1px solid "+TC.border,marginRight:8}}>{job.status}</span>
                      <span style={{color:TC.muted}}>{isOpen?"▲":"▼"}</span>
                    </div>
                    {isOpen&&(
                      <div style={{borderTop:"1px solid "+TC.border,padding:"14px 18px"}}>
                        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
                          <button onClick={()=>openModal("editJob",job)} style={{background:TC.surface,border:"1px solid "+TC.border,color:TC.text,borderRadius:7,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:600}}>Edit job</button>
                        </div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:12}}>
                          {mats.map(m=>{
                            const sl=sLbl(m.stock,m.required);const pct=Math.min(100,Math.round(m.stock/m.required*100));
                            return(
                              <div key={m.id} style={{background:TC.surface,borderRadius:10,padding:"12px 14px",minWidth:200,flex:"1 1 200px",border:"1px solid "+TC.border}}>
                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                                  <div><div style={{fontWeight:700,fontSize:13}}>{m.name}</div><div style={{color:TC.orange,fontSize:11,fontFamily:"monospace"}}>{m.mat?.sku}</div></div>
                                  <span style={{background:sl.bg,color:sl.color,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,whiteSpace:"nowrap"}}>{sl.label}</span>
                                </div>
                                <div style={{height:4,background:TC.border,borderRadius:999,marginBottom:6,overflow:"hidden"}}>

                              </div>
                            );

              <button onClick={()=>openModal("po")} style={{background:TC.orange+"22",color:TC.orange,border:"1px solid "+TC.orange,borderRadius:7,padding:"6px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>Order</button>

      {tab==="fab"&&(
        <div style={{padding:"16px 24px"}}>

              <button key={s} onClick={()=>setFabStatFilt(s)} style={{background:fabStatFilt===s?TC.orange:"transparent",color:fabStatFilt===s?"#fff":TC.muted,border:"1.5px solid "+(fabStatFilt===s?TC.orange:TC.border),borderRadius:999,padding:"5px 14px",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{s}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
            {["All",...LOCATIONS].map(l=>(
              <button key={l} onClick={()=>setLfilt(l)} style={{background:lfilt===l?TC.orange:"transparent",color:lfilt===l?"#fff":TC.muted,border:"1.5px solid "+(lfilt===l?TC.orange:TC.border),borderRadius:999,padding:"4px 14px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{l==="All"?"All Locations":l}</button>

            j.status!=="Complete"&&

            const sc=statColors[fabStat]||statColors["Queued"];

              <div key={job.id} style={{background:TC.card,borderRadius:12,padding:"16px 18px",marginBottom:10,border:"1px solid "+TC.border,borderLeft:"3px solid "+TC.orange}}>
                <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:12}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{job.name}</div>
                    <div style={{color:TC.muted,fontSize:12,marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}>
                      {job.location&&<span style={{background:job.location==="Charleston"?TC.greenBg:TC.yellowBg,color:job.location==="Charleston"?TC.green:TC.yellow,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999}}>{job.location}</span>}
                      <span>{job.job_date?fmtD(job.job_date):""}</span>

                  </div>
                  <Sel value={fabStat} onChange={async e=>{await sb.from("jobs").update({fab_status:e.target.value}).eq("id",job.id);reload();}} style={{width:"auto",minWidth:130,padding:"6px 10px",fontSize:12}}>
                    {FAB_STATS.map(s=><option key={s}>{s}</option>)}
                  </Sel>
                </div>
                {mats.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:TC.muted,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:8}}>Materials</div>
                    {mats.map(m=>(
                      <div key={m.id} style={{display:"flex",justifyContent:"space-between",background:TC.surface,borderRadius:8,padding:"8px 12px",marginBottom:6,fontSize:13}}>

                  <button onClick={()=>{
                    const rows=[["Job","Location","Material","Required","Unit"],...mats.map(m=>[job.name,job.location||"",m.name,m.required,m.mat?uLabel(m.mat,gu):"sqft"])];
                    const csv=rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
                    const blob=new Blob([csv],{type:"text/csv"});
                    const fn=job.name.replace(/[^a-z0-9]/gi,"-")+"-cutlist.csv";
                    try{if(navigator.canShare){const f=new File([blob],fn,{type:"text/csv"});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:fn});return;}}}catch(_){}
                    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
                    showToast("Cut list downloaded for "+job.name);
                  }} style={{background:TC.surface,border:"1px solid "+TC.border,color:TC.text,borderRadius:7,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:600}}>Export Cut List</button>
                </div>
              </div>
            );
          })}
          {jobs.filter(j=>j.status!=="Complete"&&(lfilt==="All"||j.location===lfilt)).length===0&&(
            <div style={{textAlign:"center",marginTop:60,color:TC.muted}}><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>No jobs yet.</div></div>
          )}
        </div>
      )}

      {/* ── FAB ──────────────────────────────────────────────────────────────── */}
      {(tab==="schedule"||tab==="materials")&&(
        <button onClick={()=>openModal(tab==="schedule"?"addJob":"addMat")} style={{position:"fixed",bottom:32,right:28,width:56,height:56,background:TC.orange,border:"none",borderRadius:"50%",color:"#fff",fontSize:28,cursor:"pointer",boxShadow:"0 4px 20px rgba(212,100,42,.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      )}

      {/* ── MODALS ───────────────────────────────────────────────────────────── */}
      {modal==="settings"&&<SettingsModal/>}
      {modal==="po"&&<POModal materials={materials} orgId={orgId} onClose={closeModal} onDone={async()=>{await logAct("PO imported","");await reload();}} showToast={showToast}/>}

      {modal==="editMat"&&mdata&&<MatModal mat={mdata} cats={cats} orgId={orgId} onClose={closeModal} onDone={async()=>{await logAct("Material edited",mdata.name);await reload();}} showToast={showToast}/>}
      {modal==="csvImport"&&<CSVModal materials={materials} orgId={orgId} onClose={closeModal} onDone={async()=>{await logAct("CSV imported","");await reload();}} showToast={showToast}/>}
      {modal==="bulkEdit"&&<BulkEditModal ids={selIds} cats={cats} onClose={()=>{closeModal();exitSel();}} onDone={reload} showToast={showToast}/>}
      {modal==="addJob"&&<JobModal job={null} profiles={profiles} orgId={orgId} onClose={closeModal} onDone={async()=>{await logAct("Job created","");await reload();}} showToast={showToast}/>}
      {modal==="editJob"&&mdata&&<JobModal job={mdata} profiles={profiles} orgId={orgId} onClose={closeModal} onDone={async()=>{await logAct("Job edited",mdata.name);await reload();}} showToast={showToast}/>}

      {toast&&<div style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",background:TC.card,border:"1px solid "+TC.orange,color:TC.text,borderRadius:10,padding:"12px 22px",fontWeight:600,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,.4)",zIndex:999,whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

// ── Add material to job row ────────────────────────────────────────────────────
function AddMatRow({job,materials,profiles,reload,showToast,TC,gu}){
  const [search,setSearch]=useState("");const [sel,setSel]=useState("");const [qty,setQty]=useState("");const [notes,setNotes]=useState("");
  const filt=search.trim()?materials.filter(m=>m.name.toLowerCase().includes(search.toLowerCase())||m.sku.toLowerCase().includes(search.toLowerCase())):materials;
  async function add(){if(!sel||!qty)return;const mat=materials.find(m=>m.id===sel);if(!mat)return;await sb.from("job_materials").insert({job_id:job.id,material_id:sel,required:parseFloat(qty),notes:notes||null});setSel("");setSearch("");setQty("");setNotes("");showToast("Material added");reload();}
  return(
    <div style={{background:TC.bg,borderRadius:9,padding:"12px 14px",border:"1px dashed "+TC.border,marginTop:12}}>
      <div style={{fontSize:11,fontWeight:700,color:TC.muted,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:8}}>Add Material</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{minWidth:220,flex:"1 1 220px"}}>
          <input value={search} onChange={e=>{setSearch(e.target.value);setSel("");}} placeholder="Search by name or SKU…" style={{width:"100%",background:TC.surface,border:"1.5px solid "+TC.border,borderRadius:8,padding:"8px 12px",fontSize:13,color:TC.text,outline:"none",marginBottom:6}}/>
          <select value={sel} onChange={e=>setSel(e.target.value)} style={{background:TC.surface,border:"1.5px solid "+TC.border,borderRadius:8,padding:"8px 12px",fontSize:13,color:TC.text,outline:"none",width:"100%"}}>
            <option value="">{filt.length===0?"No matches":"Select ("+filt.length+")"}</option>
            {filt.map(m=><option key={m.id} value={m.id}>{m.sku} — {m.name} ({m.stock})</option>)}
          </select>
        </div>
        <input type="number" value={qty} onChange={e=>setQty(e.target.value)} placeholder={gu} style={{width:80,background:TC.surface,border:"1.5px solid "+TC.border,borderRadius:8,padding:"8px 10px",fontSize:13,color:TC.text,outline:"none"}}/>
        <input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notes" style={{flex:1,minWidth:100,background:TC.surface,border:"1.5px solid "+TC.border,borderRadius:8,padding:"8px 10px",fontSize:13,color:TC.text,outline:"none"}}/>
        <button onClick={add} disabled={!sel||!qty} style={{background:(!sel||!qty)?TC.surface:TC.orange,color:(!sel||!qty)?TC.dim:"#fff",border:"1.5px solid "+(!sel||!qty?TC.border:TC.orange),borderRadius:8,padding:"8px 16px",fontWeight:700,fontSize:13,cursor:(!sel||!qty)?"default":"pointer"}}>+ Add</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
function Root(){
  const [session,setSession]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [theme,setTheme]=useState("dark");
  const C=theme==="light"?LIGHT:DARK;

  async function loadProfile(uid){
    const {data}=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
    setProfile(data||null);
  }

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{setSession(data.session);if(data.session)loadProfile(data.session.user.id);else setSession(null);});
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{setSession(s);if(s)loadProfile(s.user.id);else{setSession(null);setProfile(null);}});
    return()=>sub.subscription.unsubscribe();
  },[]);

  async function signOut(){await sb.auth.signOut();}

  if(SUPABASE_URL==="YOUR_SUPABASE_URL"||SUPABASE_ANON==="YOUR_SUPABASE_ANON_KEY"){
    return(
      <ThemeCtx.Provider value={C}>
        <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{maxWidth:480,width:"100%"}}>
            <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:36}}>🟧</div><div style={{fontWeight:800,fontSize:24,color:C.text,marginTop:8}}>Superior Stone</div></div>
            <div style={{background:C.card,border:"1px solid "+C.orange,borderRadius:16,padding:24}}>
              <div style={{fontWeight:700,fontSize:16,color:C.text,marginBottom:12}}>⚙️ Setup required</div>
              <div style={{color:C.muted,fontSize:13,lineHeight:1.7,marginBottom:16}}>
                To use this app, you need to connect it to Supabase (your free database).<br/><br/>
                <b style={{color:C.text}}>Step 1.</b> Open this HTML file in a text editor (right-click → Open with → TextEdit/Notepad).<br/><br/>
                <b style={{color:C.text}}>Step 2.</b> Find these two lines near the top and replace the placeholder values:<br/>
              </div>
              <div style={{background:C.surface,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",fontFamily:"monospace",fontSize:12,color:C.text,marginBottom:16,lineHeight:1.8}}>
                const SUPABASE_URL = "YOUR_SUPABASE_URL";<br/>
                const SUPABASE_ANON = "YOUR_SUPABASE_ANON_KEY";
              </div>
              <div style={{color:C.muted,fontSize:13,lineHeight:1.7}}>
                <b style={{color:C.text}}>Step 3.</b> Get your values from <b style={{color:C.orange}}>supabase.com</b> → your project → Project Settings → API.<br/><br/>
                <b style={{color:C.text}}>Step 4.</b> Save the file, then open DEPLOY_GUIDE.txt for the full setup walkthrough.
              </div>
            </div>
          </div>
        </div>
      </ThemeCtx.Provider>
    );
  }

  if(session===undefined)return(<ThemeCtx.Provider value={C}><div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:C.muted,fontSize:14}}>Loading…</div></div></ThemeCtx.Provider>);

  return(
    <ThemeCtx.Provider value={C}>
      <style>{`body{background:${C.bg}}`}</style>
      {!session||!profile
        ?<AuthScreen onAuth={()=>sb.auth.getSession().then(({data})=>{setSession(data.session);if(data.session)loadProfile(data.session.user.id);})}/>
        :<AppInner session={session} profile={profile} onSignOut={signOut}/>
      }
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
</body>
</html>
